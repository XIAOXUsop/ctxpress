name: Release

# 打 tag 即发布：构建产物自动挂到 GitHub Release。
# 手工上传容易漏、容易版本对不上，而这恰恰是使用者拿到的第一个东西。
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: ./mvnw -B package

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # 路径是相对仓库根的。早先 core 那行多写了一层 `ctxpress/` 前缀，
          # 于是这个 glob 永远匹配不到——而 action-gh-release 对未匹配的 glob 只告警不报错，
          # release 照常发布、只是静默少一个资产。加 fail_on_unmatched_files 让它不再静默。
          files: |
            ctxpress-cli/target/ctxpress.jar
            ctxpress-core/target/ctxpress-core-*.jar
            ctxpress-tokenizer-jtokkit/target/ctxpress-tokenizer-jtokkit-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
