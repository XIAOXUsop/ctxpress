name: Release

# 打 tag 即发布：构建产物自动挂到 GitHub Release。
# 手工上传容易漏、容易版本对不上，而这恰恰是使用者拿到的第一个东西。
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 读 Dependabot 告警需要它。缺了会 403，而预检把 403 判为**拒绝发布**
      # 而不是"没有告警"——两者在日志里长得一模一样。
      security-events: read
    steps:
      - uses: actions/checkout@v6
        with:
          # 闸二要比对"这个 tag 落后默认分支多少"，浅克隆没有历史可比。
          fetch-depth: 0

      # 发版前置检查：产物不该带着已知漏洞出门，也不该落后于默认分支。
      #
      # 为什么是 release 而不是 CI：Dependabot 告警是**仓库级**状态，不属于任何一次提交，
      # 放进 CI 会让默认分支因为一条与本次改动无关的告警长期变红——而常年红的门禁
      # 等于没有门禁（姊妹项目 amlagent 缺 NVD API key，依赖扫描就永远跑不完）。
      # 放在发版这一步，代价被限制成"这次先别发"，而发布本来也不该是全自动的。
      #
      # 两道闸缺一不可：闸一查的是**默认分支当前**的依赖图，闸二查的是**这个 tag**。
      # 只留闸一的话，「master 上已修好、产物里还是旧的」这种情况看起来完全正常——
      # 干净的是 master，不是那个产物。ctxpress 现在就有这么一处（`ef382a4` 未发布）。
      - name: Preflight (dependency alerts + tag vs default branch)
        env:
          # 闸一优先用 PAT：**Dependabot 告警接口不接受 GITHUB_TOKEN**。
          # 实测（2026-09-20）：即便给 GITHUB_TOKEN 授 `security-events: read`，
          # 仍然返回 403 `Resource not accessible by integration`；匿名访问是 401。
          # 配了 `PREFLIGHT_TOKEN`（一个 PAT）才真正查得动。
          GH_TOKEN: ${{ secrets.PREFLIGHT_TOKEN || secrets.GITHUB_TOKEN }}
          # 没配 PAT 时把闸一降级为「大声告警后放行」。**这不是为了省事**——
          # 是"整条发布流程永久卡死"与"明确降级并说清楚"之间的取舍；
          # 真读到高危告警时，脚本照样拒绝（那条路径不受影响）。
          PREFLIGHT_ALERTS_OPTIONAL: ${{ secrets.PREFLIGHT_TOKEN == '' && '1' || '' }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          base="origin/${{ github.event.repository.default_branch }}"
          out="$RUNNER_TEMP"

          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"

          # -w 把状态码单独写出来，而不是靠"响应体为空"去猜。
          # 空数组和 403/404 的响应体都不是"一大堆告警"，靠内容猜必然误判。
          curl -sS -o "$out/alerts.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/dependabot/alerts?state=open&per_page=100" \
            > "$out/alerts.http"

          args=(--alerts-http "$out/alerts.http" --alerts-json "$out/alerts.json"
                --tag "${{ github.ref_name }}" --base "$base")
          if [ -n "${PREFLIGHT_ALERTS_OPTIONAL:-}" ]; then
            echo "::warning::未配置 PREFLIGHT_TOKEN——闸一（依赖告警）本轮无法执行，降级为告警放行。Dependabot 告警接口不接受 GITHUB_TOKEN。配一个 PAT 作为仓库 secret 即可启用。"
            args+=(--alerts-optional)
          fi

          python3 scripts/release_preflight.py "${args[@]}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: ./mvnw -B package

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # 路径是相对仓库根的。早先 core 那行多写了一层 `ctxpress/` 前缀，
          # 于是这个 glob 永远匹配不到——而 action-gh-release 对未匹配的 glob 只告警不报错，
          # release 照常发布、只是静默少一个资产。加 fail_on_unmatched_files 让它不再静默。
          files: |
            ctxpress-cli/target/ctxpress.jar
            ctxpress-core/target/ctxpress-core-*.jar
            ctxpress-tokenizer-jtokkit/target/ctxpress-tokenizer-jtokkit-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
